server:
  port: 8080

spring:
  main:
    banner-mode: off
  application:
    name: ncbot
  datasource:
    url: jdbc:sqlite:ncbot.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: "PRAGMA journal_mode=WAL; PRAGMA busy_timeout=10000;"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  ai:
    openai:
      api-key: default-key
      base-url: http://localhost:11435/v1
      chat:
        options:
          model: ncbot
          # Reasoning control: deepseek-v4-flash supports max|high|low (default high).
          # "low" is the minimum supported effort and the fastest setting.
          # ("none" is NOT a valid value for this model.)
          reasoning-effort: low

ncbot:
  ai-timeout: 10m
  memory-update-period: 30m
  weather-timeout: 10s

# NOTE: All other ncbot.* settings (name, prompts, chat limits, channel routing,
# blocking) now live in the database `config_item` table and are managed via the
# admin UI at /v1/config. They are seeded with sensible defaults on first start.
# Only the values below are read at startup and cannot be moved to the DB:
#   - ai-timeout         : baked into the OpenAI client at startup
#   - memory-update-period : fixed-delay scheduler interval (restart to change)
#   - weather-timeout    : baked into the weather client at startup
# Spring AI credentials/model and datasource also remain in application.yml.

gg:
  jte:
    development-mode: false
    use-precompiled-templates: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %level %logger{0} : %msg%n"
  level:
    root: WARN
    org.huebert: INFO